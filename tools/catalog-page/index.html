<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kioku Tower Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: the game's own sticker look. Berry ground, one paper sheet per tab, sortable tables with the real art in the first column. */
:root {
  color-scheme: dark;
  --ground: #6b1f3f; --blob: #8c2a52; --ring: #ff8fb0;
  --paper: #fff6ec; --paper-2: #f8e9dc; --ink: #2a1626; --muted: #7a5a6c;
  --pink: #ff5d8f; --sun: #ffc53d; --mint: #4fd1b9; --sky: #5aaeff; --coral: #ff6b5e; --lilac: #a98bf0; --grey: #b9b3b0;
  --on-ground: #fff6ec; --on-ground-muted: #f3c4d4;
  --display: "Fredoka", "M PLUS Rounded 1c", system-ui, sans-serif;
  --ui: "M PLUS Rounded 1c", "Fredoka", system-ui, sans-serif;
  --line: 3px solid var(--ink);
  --shadow: 0 8px 18px rgba(40, 6, 24, .35);
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--ui); font-weight: 500; }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 52px); line-height: 1; margin: 0; color: var(--paper); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; letter-spacing: -.01em; }
h1 span { color: var(--sun); }
.sub { color: var(--on-ground-muted); margin: 8px 0 0; font-weight: 800; max-width: 60ch; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { background: rgba(42, 22, 38, .35); color: var(--on-ground); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px; }
.count b { font-family: var(--display); font-size: 16px; color: var(--sun); }

nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav a { font-family: var(--display); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--ink); background: var(--paper); border: var(--line); border-radius: 14px; padding: 7px 14px 9px; box-shadow: inset 0 -4px 0 var(--paper-2); }
nav a[aria-current="page"] { background: var(--sun); box-shadow: inset 0 -4px 0 #d99a12; }
nav a:focus-visible, button:focus-visible, input:focus-visible, th button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

.sheet { background: var(--paper); border: var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input { font: 800 14px var(--ui); border: var(--line); border-radius: 12px; padding: 8px 12px; min-width: 0; width: min(280px, 100%); background: #fff; color: var(--ink); }
.chip { font: 800 13px var(--ui); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 11px; background: #fff; color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.shown { margin-left: auto; color: var(--muted); font-weight: 800; font-size: 13px; }
.note { margin: 0; color: var(--muted); line-height: 1.5; max-width: 75ch; }

.scroll { overflow-x: auto; border-radius: 14px; border: 2px solid var(--ink); }
table { border-collapse: collapse; width: 100%; min-width: 760px; background: #fff; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; vertical-align: middle; border-bottom: 1px solid #eadbd0; }
th { background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 1; font-weight: 800; white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button::after { content: '↕'; opacity: .45; font-size: 11px; }
th[aria-sort="ascending"] button::after { content: '▲'; opacity: 1; }
th[aria-sort="descending"] button::after { content: '▼'; opacity: 1; }
tbody tr:nth-child(even) td { background: #fffaf5; }
tbody tr:hover td { background: #fff0e4; }
td.num { font-variant-numeric: tabular-nums; font-family: var(--display); font-weight: 700; font-size: 16px; }
td .name { font-family: var(--display); font-weight: 700; font-size: 16px; }
td .id { display: block; color: var(--muted); font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
td .up { color: #2f8a3f; font-weight: 800; }
.small { color: var(--muted); font-size: 12px; }
ul.moves { margin: 0; padding-left: 18px; }
ul.moves li { margin: 1px 0; }

.art { width: 52px; height: 52px; border: 2px solid var(--ink); border-radius: 12px; display: grid; place-items: center; overflow: hidden; background: var(--paper-2); }
.art svg { width: 100%; height: 100%; display: block; }
.art.card { padding: 8px; }
.art.t-attack { background: var(--coral); } .art.t-skill { background: var(--sky); } .art.t-power { background: var(--lilac); } .art.t-status { background: var(--grey); }
.art.charm { padding: 4px; background: #fff; }
.art.enemy { width: 84px; height: 84px; background: #fdeee6; }
.art.boss { width: 120px; height: 120px; }
.art.room { width: 46px; height: 46px; border-radius: 50%; padding: 8px; }

.tag { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font-weight: 800; font-size: 12px; white-space: nowrap; background: #fff; }
.tag.attack { background: var(--coral); } .tag.skill { background: var(--sky); } .tag.power { background: var(--lilac); } .tag.status, .tag.curse { background: var(--grey); }
.tag.starter { background: #fff; } .tag.common { background: #eee6df; } .tag.uncommon { background: var(--mint); } .tag.rare { background: var(--sun); }
.tag.haru { background: var(--ring); } .tag.drop { background: #eee6df; } .tag.shop { background: var(--sun); } .tag.boss, .tag.Boss { background: var(--pink); color: #fff; }
.tag.Elite { background: var(--lilac); } .tag.Normal { background: #eee6df; }
.style { font-weight: 800; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tile { border: var(--line); border-radius: 18px; background: #fff; padding: 14px; display: grid; gap: 8px; align-content: start; }
.tile h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.tile p { margin: 0; line-height: 1.5; }
.opts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.opts li { background: var(--paper-2); border-radius: 10px; padding: 6px 10px; }
.opts b { font-family: var(--display); }
.look { justify-items: center; text-align: center; }
.look .art { width: 160px; height: 160px; border-radius: 50%; background: var(--ring); }
.pair { display: flex; gap: 8px; justify-content: center; }
.pair .art { width: 104px; height: 104px; }
.boss-row { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
@media (max-width: 520px) { .boss-row { grid-template-columns: 1fr; } }
.loading { color: var(--on-ground-muted); font-weight: 800; }
@media (prefers-reduced-motion: no-preference) { nav a { transition: transform 120ms ease-out; } nav a:active { transform: translateY(2px); } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Kioku Tower <span>Catalog</span></h1>
      <p class="sub">Every character, outfit, card, charm, enemy, boss, event and rule in the Net Café Tower, with the in-game art. Click a column header to sort.</p>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <nav id="tabs" aria-label="Sections"></nav>
  <main id="view"><p class="loading">Loading the catalog…</p></main>
</div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : '';
const POOL = { haru: "Haru's Gift", drop: 'Drop', shop: 'Shop only', boss: 'Boss reward' };
const RAR_ORDER = { starter: 0, common: 1, uncommon: 2, rare: 3, status: 4, curse: 5 };
const KIND_ORDER = { Normal: 0, Elite: 1, Boss: 2 };
let D;

const TABS = [
  { id: 'cards', label: 'Cards' },
  { id: 'charms', label: 'Charms' },
  { id: 'enemies', label: 'Enemies' },
  { id: 'bosses', label: 'Bosses' },
  { id: 'events', label: 'Events' },
  { id: 'styles', label: 'Play styles & statuses' },
  { id: 'rules', label: 'Rooms & floors' },
  { id: 'characters', label: 'Jenny & Toni' },
  { id: 'outfits', label: 'Couple outfits' },
];
const state = { q: '', filter: 'all', sort: null };

// ---------- generic sortable table ----------
function table(rows, cols, filters, filterKey, note) {
  const q = state.q.toLowerCase();
  let list = rows.filter((r) => (state.filter === 'all' || r[filterKey] === state.filter) && (!q || JSON.stringify(r).replace(/<svg[\s\S]*?<\/svg>/g, '').toLowerCase().includes(q)));
  if (state.sort) {
    const c = cols.find((x) => x.key === state.sort.key);
    const v = c.sortVal || ((r) => r[c.key]);
    list = [...list].sort((a, b) => { const x = v(a), y = v(b); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * state.sort.dir; });
  }
  return `<section class="sheet">
    ${note ? `<p class="note">${note}</p>` : ''}
    <div class="tools">
      <input id="search" type="search" placeholder="Search…" aria-label="Search" value="${esc(state.q)}">
      ${filters.map(([v, l]) => `<button class="chip" data-filter="${v}" aria-pressed="${state.filter === v}">${esc(l)}</button>`).join('')}
      <span class="shown">${list.length} of ${rows.length}</span>
    </div>
    <div class="scroll"><table><thead><tr>${cols.map((c) => c.key ? `<th aria-sort="${state.sort?.key === c.key ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${c.key}">${c.label}</button></th>` : `<th>${c.label}</th>`).join('')}</tr></thead>
    <tbody>${list.map((r) => `<tr>${cols.map((c) => `<td${c.num ? ' class="num"' : ''}>${c.cell(r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}">Nothing matches.</td></tr>`}</tbody></table></div>
  </section>`;
}
const nameCell = (r, name = r.name) => `<span class="name">${esc(name)}</span><span class="id">${esc(r.id)}</span>`;

const VIEWS = {
  cards: () => table(D.cards, [
    { label: 'Art', cell: (r) => `<div class="art card t-${r.type}">${r.art}</div>` },
    { label: 'Name', key: 'name', cell: nameCell },
    { label: 'Type', key: 'type', cell: (r) => `<span class="tag ${r.type}">${cap(r.type)}</span>` },
    { label: 'Rarity', key: 'rarity', sortVal: (r) => RAR_ORDER[r.rarity], cell: (r) => `<span class="tag ${r.rarity}">${cap(r.rarity)}</span>` },
    { label: 'Style', key: 'style', cell: (r) => r.style ? `<span class="style">${esc(r.style)}</span>${r.style.includes('/') ? '<span class="id">hybrid</span>' : ''}` : '<span class="small">—</span>' },
    { label: 'Effect', cell: (r) => esc(r.text) },
    { label: 'Upgraded (+)', cell: (r) => r.rarity === 'status' || r.rarity === 'curse' ? '<span class="small">Can’t upgrade</span>' : r.up === r.text ? '<span class="small">Same</span>' : `<span class="up">${esc(r.up)}</span>` },
    { label: 'Shows up when', cell: (r) => r.starter ? `<span class="small">Starter deck: ${esc(r.starter)}</span>` : r.requires ? `<span class="small">${esc(r.requires)}</span>` : r.rarity === 'status' ? '<span class="small">Added by enemies</span>' : r.rarity === 'curse' ? '<span class="small">From events</span>' : '<span class="small">Always</span>' },
  ], [['all', 'All'], ['attack', 'Attack'], ['skill', 'Skill'], ['power', 'Power'], ['status', 'Status']], 'type',
  'Each card in your deck is a pair on the board. Match the pair to play it; each flip costs energy. Upgrades come from Practice at rest booths and some events. There is no “draw a card”: anything that would draw reveals cards instead. Hybrid cards count toward two styles.'),

  charms: () => table(D.charms, [
    { label: 'Art', cell: (r) => `<div class="art charm">${r.art}</div>` },
    { label: 'Name', key: 'name', cell: nameCell },
    { label: 'Where from', key: 'pool', cell: (r) => `<span class="tag ${r.pool}">${POOL[r.pool]}</span>` },
    { label: 'Style', key: 'style', cell: (r) => r.style ? `<span class="style">${esc(r.style)}</span>` : '<span class="small">—</span>' },
    { label: 'Effect', cell: (r) => esc(r.desc) },
    { label: 'Only shows up if', cell: (r) => r.requires ? `<span class="small">${esc(r.requires)}</span>` : '<span class="small">—</span>' },
  ], [['all', 'All'], ['haru', "Haru's Gift"], ['drop', 'Drop'], ['shop', 'Shop only'], ['boss', 'Boss reward']], 'pool',
  `Charms are passive and last the whole run. Haru's Gift offers 3 of the ${D.charms.filter((c) => c.pool === 'haru').length} starters at the start. Shop-only charms never drop anywhere else.`),

  enemies: () => table(D.enemies.filter((e) => e.kind !== 'Boss'), [
    { label: 'Art', cell: (r) => `<div class="art enemy">${r.art}</div>` },
    { label: 'Name', key: 'name', cell: nameCell },
    { label: 'Kind', key: 'kind', sortVal: (r) => KIND_ORDER[r.kind], cell: (r) => `<span class="tag ${r.kind}">${r.kind}</span>` },
    { label: 'Floor', key: 'floor', cell: (r) => esc(r.floor) },
    { label: 'HP', key: 'hpMax', num: true, cell: (r) => esc(r.hp) },
    { label: 'Moves', cell: (r) => `<ul class="moves">${r.moves.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>${r.extra ? `<span class="small">${esc(r.extra)}</span>` : ''}` },
    { label: 'Move order', key: 'ai', cell: (r) => `<span class="small">${esc(r.ai)}</span>` },
  ], [['all', 'All'], ['Normal', 'Normal'], ['Elite', 'Elite']], 'kind',
  '"In order" enemies repeat their move list top to bottom. "Random" enemies pick a move but never use the same one 3 times in a row.'),

  bosses: () => `<section class="sheet"><p class="note">One boss waits at the end of each floor. Beating one lets you pick 1 of 3 boss-only charms.</p>
    ${D.enemies.filter((e) => e.kind === 'Boss').map((b) => `<div class="tile boss-row"><div class="art enemy boss">${b.art}</div>
      <div style="display:grid;gap:8px;min-width:0"><h3>${esc(b.name)}</h3><p><span class="tag Boss">Boss</span> ${esc(b.floor)} · <b>${esc(b.hp)} HP</b> · moves ${esc(b.ai.toLowerCase())}</p>
      <ol class="moves">${b.moves.map((m) => `<li>${esc(m)}</li>`).join('')}</ol>${b.extra ? `<p class="small">${esc(b.extra)}</p>` : ''}</div></div>`).join('')}</section>`,

  events: () => `<section class="sheet"><p class="note">"?" rooms. Each run draws events from a shuffled deck, so you never see the same one twice in a run.</p>
    <div class="grid">${D.events.map((e) => `<article class="tile"><h3>${esc(e.title)}</h3>${e.requires ? `<span class="small">Only if: ${esc(e.requires)}</span>` : ''}<p>${esc(e.text)}</p>
    <ul class="opts">${e.options.map((o) => `<li><b>${esc(o.label)}</b>${o.note ? ` · ${esc(o.note)}` : ''}${o.cond ? ` <span class="small">(needs ${esc(o.cond)})</span>` : ''}</li>`).join('')}</ul></article>`).join('')}</div></section>`,

  styles: () => `<section class="sheet"><p class="note">Every style is open to every character. Once your deck leans into a style, card rewards and shops offer more of it (starter cards don't count). Hybrid cards count toward two styles.</p>
    <ul class="opts"><li><b>${esc(D.statuses.find((x) => x.id === 'weak').name)} → Asleep:</b> an enemy that reaches ${D.rules.sleepAt} Sleepy skips its next ${D.rules.sleepTurns} turns (bosses ${D.rules.bossSleepTurns}). It can't get more Sleepy while asleep, and each time it wakes up it takes ${D.rules.sleepGrow} more to fall asleep again.</li><li><b>Cozy:</b> on a Cozy card, healing past your max HP hits the enemy.</li></ul>
    <div class="grid">${D.styles.map((s) => `<article class="tile" style="border-top:10px solid ${s.color}"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p>
      <p class="small"><b>Cards:</b> ${esc(s.cards.join(', '))}</p><p class="small"><b>Charms:</b> ${esc(s.charms.join(', ') || '—')}</p></article>`).join('')}</div></section>
    <section class="sheet" style="margin-top:18px"><h3 style="margin:0;font-family:var(--display)">Statuses</h3>
    <div class="scroll"><table style="min-width:0"><thead><tr><th>Name</th><th>What it does</th></tr></thead><tbody>${D.statuses.map((s) => `<tr><td><span class="name">${esc(s.name)}</span><span class="id">${esc(s.id)}</span></td><td>${esc(s.help)}</td></tr>`).join('')}</tbody></table></div></section>`,

  rules: () => `<section class="sheet"><h3 style="margin:0;font-family:var(--display)">Rooms</h3>
    <div class="grid">${D.rooms.map((r) => `<div class="tile" style="grid-template-columns:auto 1fr;align-items:center"><div class="art room">${r.art}</div><div><h3>${ROOM[r.type][0]}</h3><p class="small">${ROOM[r.type][1]}</p></div></div>`).join('')}</div></section>
    <section class="sheet" style="margin-top:18px"><h3 style="margin:0;font-family:var(--display)">Floors</h3>
    <div class="scroll"><table style="min-width:620px"><thead><tr><th>Floor</th><th>Normal enemies</th><th>Elites</th><th>Boss</th></tr></thead><tbody>${D.acts.map((a) => `<tr><td><span class="name">${esc(a.name)}</span></td><td>${esc(a.normals.join(', '))}</td><td>${esc(a.elites.join(', '))}</td><td><b>${esc(a.boss)}</b></td></tr>`).join('')}</tbody></table></div>
    <ul class="opts">${RULES.map((r) => `<li>${r}</li>`).join('')}</ul></section>`,

  characters: () => `<section class="sheet"><p class="note">Pick who climbs at the start of each run. Every card style is open to both; a character only changes max HP, the starting deck and one passive.</p>
    <div class="grid">${D.characters.map((c) => `<article class="tile look"><div class="art">${c.art}</div><h3>${esc(c.name)}</h3><p>${esc(c.blurb)}</p>
      <ul class="opts" style="text-align:left;width:100%"><li><b>${c.maxHp} max HP</b></li><li>${esc(c.passive)}</li><li><b>Starts with:</b> ${esc(c.deck)}</li><li><b>Unlock:</b> ${esc(c.unlock)}</li></ul></article>`).join('')}</div></section>
    <section class="sheet" style="margin-top:18px"><h3 style="margin:0;font-family:var(--display)">Jenny's Sticker Book</h3>
    <p class="note">Every ${D.rules.stickerEvery}th match in a fight peels off the next sticker. They come from a shuffled deck of ${D.stickers.length}, so each shows up once before any repeat, and the next one is shown in her status chip.</p>
    <div class="scroll"><table style="min-width:0"><thead><tr><th>Sticker</th><th>Effect</th></tr></thead><tbody>${D.stickers.map((s) => `<tr><td><span class="name">${esc(s.name)}</span></td><td>${esc(cap(s.text))}</td></tr>`).join('')}</tbody></table></div></section>`,

  outfits: () => `<section class="sheet"><p class="note">Matching couple outfits. Each set has a look for Jenny and one for Toni, and both unlock together. Change them from Outfits on the title screen.</p>
    <div class="grid">${D.outfits.map((o) => `<article class="tile look"><div class="pair"><div class="art">${o.jenny}</div><div class="art">${o.toni}</div></div><h3>${esc(o.name)}</h3><p>${esc(o.desc)}</p><span class="tag ${o.unlock === 'From the start' ? 'common' : 'rare'}">${esc(o.unlock)}</span></article>`).join('')}</div></section>`,
};

const ROOM = {
  fight: ['Fight', 'A normal enemy from this floor. Rewards 12–20 coins and a card pick.'],
  elite: ['Elite', 'A tougher enemy. Rewards 30–39 coins, a card pick and a charm. At most 2 on any path.'],
  event: ['Unknown (?)', 'A random event from the event deck.'],
  shop: ['Shop', '5 cards, 2 shop-only charms + 1 regular charm, and card removal. Every path has at least one.'],
  rest: ['Rest booth', 'Nap to heal 30% of max HP, or Practice to upgrade a card. Every path has at least two.'],
  treasure: ['Treasure', 'Always the 5th room of the climb. A prize locker with a charm (60 coins if none are left).'],
  boss: ['Boss', 'End of the floor. Rewards 90 coins and a pick of 1 from 3 boss-only charms.'],
};
let RULES = [];

function render() {
  const id = TABS.some((t) => t.id === location.hash.slice(1)) ? location.hash.slice(1) : 'cards';
  document.querySelectorAll('#tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.tab === id ? 'page' : 'false'));
  const focused = document.activeElement?.id === 'search';
  const pos = focused ? document.activeElement.selectionStart : 0;
  document.getElementById('view').innerHTML = VIEWS[id]();
  if (focused) { const s = document.getElementById('search'); s.focus(); s.setSelectionRange(pos, pos); }
}
function switchTab() { state.q = ''; state.filter = 'all'; state.sort = null; render(); }

document.addEventListener('input', (e) => { if (e.target.id === 'search') { state.q = e.target.value; render(); } });
document.addEventListener('click', (e) => {
  const f = e.target.closest('[data-filter]'); if (f) { state.filter = f.dataset.filter; render(); return; }
  const s = e.target.closest('[data-sort]');
  if (s) { const k = s.dataset.sort; state.sort = state.sort?.key === k ? (state.sort.dir > 0 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 }; render(); }
});
window.addEventListener('hashchange', switchTab);

fetch('data.json').then((r) => r.json()).then((data) => {
  D = data;
  RULES = [
    `Every new board starts with ${D.freeReveal} cards revealed for free.`,
    'Reveals that don’t fit on a nearly cleared board carry over to the next board.',
    'The first room is always a fight, the 5th a treasure, and the last room before the boss a rest booth.',
    'Every path is checked so it has at least 2 rest booths, at least 1 shop and no more than 2 elites.',
  ];
  document.getElementById('tabs').innerHTML = TABS.map((t) => `<a href="#${t.id}" data-tab="${t.id}">${t.label}</a>`).join('');
  const n = { Characters: D.characters.length, Outfits: D.outfits.length, Cards: D.cards.length, Charms: D.charms.length, Enemies: D.enemies.filter((e) => e.kind !== 'Boss').length, Bosses: D.enemies.filter((e) => e.kind === 'Boss').length, Events: D.events.length };
  document.getElementById('counts').innerHTML = Object.entries(n).map(([k, v]) => `<span class="count"><b>${v}</b> ${k}</span>`).join('');
  render();
}).catch(() => { document.getElementById('view').innerHTML = '<p class="loading">The catalog data didn’t load. Refresh the page to try again.</p>'; });
</script>
