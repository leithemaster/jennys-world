<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#81bfbc" />
    <title>Jenny's World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2381bfbc'/><path d='M20 7a9 9 0 1 0 5 15a7 7 0 1 1-5-15z' fill='%23f3a6bd'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Jenny's World, a tiny planet with a street of shops"></canvas>

    <div id="title" class="title-screen">
      <h1 class="logo" aria-label="Jenny's World">
        <span>JENNY'S</span>
        <span>WORLD</span>
      </h1>
      <button id="enter" class="enter-btn" disabled>loading…</button>
      <p class="title-hint">a tiny planet · walk around · visit the shops</p>
    </div>

    <div id="hud" class="hud" hidden>
      <div class="hud-side">
        <button class="tile-btn icon" id="btn-wardrobe" aria-label="Change outfit" title="Change outfit">
          <svg viewBox="0 0 32 32"><path d="M11 5 L16 8 L21 5 L28 10 L25 15 L22 13 V27 H10 V13 L7 15 L4 10 Z" fill="currentColor"/></svg>
        </button>
        <button class="tile-btn icon" id="btn-help" aria-label="How to play" title="How to play">
          <svg viewBox="0 0 32 32"><text x="16" y="23" text-anchor="middle" font-size="20" font-weight="900" fill="currentColor" font-family="sans-serif">?</text></svg>
        </button>
      </div>
      <div id="prompt" class="prompt" hidden>
        <kbd>E</kbd><span></span>
      </div>
      <div id="help" class="help" hidden>
        <p><b>Move</b> W A S D or arrow keys · on a phone, drag anywhere on the left half</p>
        <p><b>Enter places</b> walk up to a door and press E (or tap the prompt)</p>
        <p><b>Outfits</b> visit Mochi Moon or tap the shirt button</p>
      </div>
      <div id="stick" class="stick" hidden><i></i></div>
    </div>

    <div id="wardrobe" class="overlay wardrobe" hidden></div>
    <div id="cardgame" class="overlay cardgame" hidden></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
